# Prefix: control + a
set -g prefix C-a

# splitting horizontally/vertically
bind-key | split-window -h
bind-key - split-window -v

# resizing windows (press and hold prefix)
bind-key -r C-h resize-pane -L 5
bind-key -r C-j resize-pane -D 5
bind-key -r C-k resize-pane -U 5
bind-key -r C-l resize-pane -R 5

# ctrl + vi-style arrows for window switching
# -n flag means the prefix is omitted
# can remove -n in case of conflicting terminal bindings
bind-key -n C-h select-pane -L
bind-key -n C-j select-pane -D
bind-key -n C-k select-pane -U
bind-key -n C-l select-pane -R

# arrow keys work as well
bind-key Left select-pane -L
bind-key Down select-pane -D
bind-key Up select-pane -U
bind-key Right select-pane -R

# set the window and pane index to start from 1
set -g base-index 1
setw -g pane-base-index 1

# reload tmux config
bind-key r source-file ~/.tmux.conf \; display-message "Reloaded .tmux.conf"

# ==>  UI stuff

set -g default-terminal "tmux-256color"

# status bar
set -g status-style 'fg=brightred' # text color

# left status (session and windows section)
setw -g window-status-current-style 'bg=brightred fg=#ffffff'

# right status (date section)
set -g status-right ' %a, %b %d, %Y - %H:%M %Z '
set -g status-right-style 'bg=brightred fg=#ffffff'

# panes
set -g pane-active-border-style 'fg=brightred'
